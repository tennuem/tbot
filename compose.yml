services:

  mongodb:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - data-volume:/data/db
    ports:
      - 27017:27017

  app:
    build: .
    environment:
      TBOT_TELEGRAM_TOKEN: token
      TBOT_TELEGRAM_EMOJI_SET: "${TBOT_TELEGRAM_EMOJI_SET:-}"
      TBOT_SPOTIFY_CLIENT_ID: cid
      TBOT_SPOTIFY_CLIENT_SECRET: csecret
      TBOT_YANDEX_PROXY_URL: "${TBOT_YANDEX_PROXY_URL:-}"
      TBOT_MONGODB_ADDR: mongodb://root:root@mongodb:27017/?ssl=false
      TBOT_SQLITE_DATA_SOURCE: /data/tbot.db
      TBOT_LOGGER_LEVEL: "debug"
    volumes:
      - ./db:/data
    depends_on:
      - mongodb

volumes:
  data-volume:
